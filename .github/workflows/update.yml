name: Aggiorna bandi

on:
  schedule:
    # 06:00 ora italiana (05:00 UTC d'estate, 06:00 d'inverno: l'orario UTC è fisso)
    - cron: "0 5 * * *"
  workflow_dispatch:        # permette di lanciarlo a mano dalla scheda Actions
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "data/curated.json"

permissions:
  contents: write

concurrency:
  group: aggiorna-bandi
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Nessuna dipendenza: gli script usano solo la libreria standard.
      - name: Genera jobs.json
        run: python scripts/build.py

      - name: Pubblica se ci sono novità
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/jobs.json
          if git diff --staged --quiet; then
            echo "Nessuna novità."
          else
            git commit -m "Aggiornamento bandi $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
